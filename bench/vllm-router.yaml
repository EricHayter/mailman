# vLLM's router, with its cache-aware policy at default settings, in front of
# the same vLLM pods as mailman. bench/run-k8s.sh fills in WORKER_URLS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  labels:
    app: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      containers:
        - name: vllm-router
          # The benchmark's image (bench/Dockerfile), which includes it.
          image: mailman-bench:dev
          imagePullPolicy: Never
          command: ["vllm-router"]
          args: ["--host", "0.0.0.0", "--port", "3000", "--policy", "cache_aware",
                 "--worker-urls", ${WORKER_URLS}]
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-router
spec:
  selector:
    app: vllm-router
  ports:
    - name: http
      port: 3000
      targetPort: http
