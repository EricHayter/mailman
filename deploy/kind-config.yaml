# Used by scripts/kind-up.sh.
# Each node mounts the host's Hugging Face cache so pods don't redownload models.
# kind doesn't expand ${HOME} itself; the script runs this through envsubst.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ${HOME}/.cache/huggingface
        containerPath: /var/cache/huggingface
    # localhost:3000 -> the mailman Service's nodePort (deploy/mailman.yaml).
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        listenAddress: 127.0.0.1
  - role: worker
    extraMounts:
      - hostPath: ${HOME}/.cache/huggingface
        containerPath: /var/cache/huggingface
  - role: worker
    extraMounts:
      - hostPath: ${HOME}/.cache/huggingface
        containerPath: /var/cache/huggingface
