# vLLM backends for the cache-aware router.
# Start:  docker compose up -d
# Logs:   docker compose logs -f vllm-0
# Stop:   docker compose down

x-vllm: &vllm
  image: vllm/vllm-openai-cpu:v0.33.0
  ipc: host
  cap_add:
    - SYS_PTRACE            # lets you attach py-spy / gdb
  security_opt:
    - seccomp=unconfined
  volumes:
    - ~/.cache/huggingface:/root/.cache/huggingface
  environment:
    VLLM_CPU_KVCACHE_SPACE: "4"   # GB of KV cache per instance
  command:
    - --model
    - Qwen/Qwen3-0.6B
    - --max-model-len
    - "4096"
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 120s   # model load can take a while on CPU

services:
  vllm-0:
    <<: *vllm
    ports:
      - "8000:8000"
    # cpuset: "0-3"        # pin cores once a second instance exists

  # Uncomment when you start on routing logic:
